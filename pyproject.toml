[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailatt"
version = "0.2.0"
description = "Offline local email attachment collection, content-addressed archive and audit ledger"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mailatt local fixture project"}]
dependencies = [
  "Flask>=3.0,<4",
  "PyYAML>=6.0,<7",
  "cryptography>=42.0,<51",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
mailatt = "mailatt.cli:main"

[tool.setuptools]
packages = ["mailatt"]
include-package-data = true

[tool.setuptools.package-data]
mailatt = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
